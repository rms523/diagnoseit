    "pillow>=12.3.0",
    "pypdf>=6.0.0",
    "requests>=2.32.5",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "celery>=5.5.0",
    "gunicorn>=21.2.0",
    "openai>=1.0.0",
]
