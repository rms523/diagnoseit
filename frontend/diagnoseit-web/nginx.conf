# Preserve the public scheme supplied by the host TLS proxy. Development has no
# such header, so it falls back to the scheme used to reach this container.
map $http_x_forwarded_proto $public_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS proxy on the host or the local network, use the client address it forwards, so the
    # backend's login limits count each client rather than the proxy. Public addresses are never trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    
    # Increase client max body size for bulk file uploads
    client_max_body_size 100M;

    # Use Docker's embedded DNS for dynamic resolution
    resolver 127.0.0.11 valid=30s;

    # index.html names the hashed bundles, so it must be revalidated on every load. Without a
    # Cache-Control header a browser caches it heuristically and keeps loading the previous build,
    # which makes a deploy look like it did nothing.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Build output is content-hashed: a changed file gets a new name, so these never need revalidating.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to Django backend
    location /api/ {
        set $backend_url http://backend:8000;
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        
        # Increase timeouts for VLM parsing (can take 1-3 min per page)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Django admin, served from this origin so its /static/ stylesheets load.
    location /admin/ {
        set $backend_url http://backend:8000;
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_scheme;
    }

    # Medical uploads are available only through signed /api/.../download URLs.
    location /media/ {
        return 404;
    }

    # Django's collectstatic output is shared with this container in production.
    location /static/ {
        alias /usr/share/nginx/backend-static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;
}
